<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Discoverability</title>
    <style>
      /* Ledger's tokens (packages/design/src/tokens.ts), copied: a sandboxed page can't share the admin's CSS. */
      :root {
        --paper: oklch(1 0 0);
        --ink: oklch(0.145 0 0);
        --muted-foreground: oklch(0.52 0 0);
        --rule: oklch(0.922 0 0);
        --ok: oklch(0.455 0.105 152);
        --wait: oklch(0.49 0.115 62);
        --bad: oklch(0.5 0.185 28);
        --idle: oklch(0.48 0 0);
        color-scheme: light;
      }
      :root[data-theme='dark'] {
        --paper: oklch(0.205 0 0);
        --ink: oklch(0.985 0 0);
        --muted-foreground: oklch(0.708 0 0);
        --rule: oklch(1 0 0 / 10%);
        --ok: oklch(0.77 0.1 152);
        --wait: oklch(0.8 0.12 75);
        --bad: oklch(0.72 0.14 25);
        --idle: oklch(0.708 0 0);
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font:
          13px/1.45 'Inter Variable',
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      main {
        padding: 2px 0 4px;
      }
      header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--rule);
      }
      header p {
        margin: 0;
        color: var(--muted-foreground);
        font-size: 12px;
      }
      #score {
        font-variant-numeric: tabular-nums;
        font-weight: 500;
        white-space: nowrap;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      li {
        display: grid;
        grid-template-columns: 16px 1fr;
        gap: 8px;
        padding: 8px 0;
        border-bottom: 1px solid var(--rule);
      }
      li:last-child {
        border-bottom: 0;
      }
      .mark {
        display: grid;
        place-items: center;
        width: 16px;
        height: 16px;
        margin-top: 1px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
        line-height: 1;
        color: var(--paper);
      }
      .pass .mark {
        background: var(--ok);
      }
      .warn .mark {
        background: var(--wait);
      }
      .fail .mark {
        background: var(--bad);
      }
      .info .mark {
        background: transparent;
        color: var(--idle);
        box-shadow: inset 0 0 0 1px var(--idle);
      }
      strong {
        font-weight: 500;
      }
      li p {
        margin: 1px 0 0;
        color: var(--muted-foreground);
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p>For search engines, assistants and agents</p>
        <span id="score" aria-live="polite">Checking…</span>
      </header>
      <ul id="checks"></ul>
    </main>
    <script src="discoverability.js"></script>
  </body>
</html>
