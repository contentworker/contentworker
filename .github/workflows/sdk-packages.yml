name: SDK packages

# Packs @contentworker/sdk the way npm will see it, then loads every subpath (ESM and CJS),
# type-checks every subpath and runs the `contentworker` binary from the installed tarball, so
# the SDK can't ship an export, a declaration or a bin that points at nothing.
on:
  pull_request:
    paths:
      - "packages/sdk/**"
      - "packages/cli/**"
      - "scripts/sdk-packages.ts"
      - "pnpm-workspace.yaml"
      - ".github/workflows/sdk-packages.yml"
      - ".github/workflows/sdk-release.yml"

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pack the SDK
        run: node scripts/sdk-packages.ts pack
      - name: Install the tarball and load every subpath
        run: node scripts/sdk-packages.ts check
