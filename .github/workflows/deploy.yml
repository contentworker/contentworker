name: Deploy

# Ships main to one deployment of the fleet (deployments/<id>.jsonc). CI calls this once per
# deployment, ring by ring; see docs/deployment.md.
on:
  workflow_call:
    inputs:
      deployment:
        description: One deployment from `node scripts/fleet.ts matrix`, as JSON
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: ${{ fromJSON(inputs.deployment).id }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The deployment's GitHub environment holds its secrets: PRINCIPAL_KEY, DATA_KEY, TOKEN_PEPPER
    # and MEDIA_SIGNING_SECRET (required), PASSWORD_PEPPER and SETUP_TOKEN (web), the *_PREVIOUS
    # keys during a rotation, OIDC_CLIENT_SECRET, STREAM_WEBHOOK_SECRET, MCP_TOKEN, ADMIN_TOKEN.
    # CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID can be repository secrets.
    environment:
      name: ${{ fromJSON(inputs.deployment).environment }}
      url: https://${{ fromJSON(inputs.deployment).domain }}
    concurrency:
      group: deploy-${{ fromJSON(inputs.deployment).id }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ID: ${{ fromJSON(inputs.deployment).id }}
      DOMAIN: ${{ fromJSON(inputs.deployment).domain }}
      # Rendered next to each app's wrangler.jsonc by the Render step.
      CONFIG: wrangler.${{ fromJSON(inputs.deployment).id }}.json
    defaults:
      run:
        shell: bash
    steps:
      # A merge that silently skips its deploy looks like a deploy: fail instead.
      - name: Check deploy credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set to deploy"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The Cloudflare API sometimes fails a request outright and succeeds on the next try. Each
      # step below is idempotent, so `retry` runs it up to three times.
      - name: Install retry helper
        run: |
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/retry" <<'SH'
          #!/usr/bin/env bash
          for attempt in 1 2 3; do
            "$@" && exit 0
            echo "::warning::attempt $attempt failed: $*"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 15))
          done
          exit 1
          SH
          chmod +x "$HOME/.local/bin/retry"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Render config
        run: |
          node scripts/fleet.ts render "$ID"
          eval "$(node scripts/fleet.ts names "$ID")"
          { echo "API_DOMAIN=$API_DOMAIN"; echo "CDN_DOMAIN=$CDN_DOMAIN"; } >> "$GITHUB_ENV"
      # Only the secrets set in the environment; `--secrets-file` adds to a Worker's secrets and
      # never removes one, so a secret set by hand survives. The engine's ASSISTANT_PRINCIPAL_KEY
      # and ASSISTANT_PRINCIPAL_KEY_PREVIOUS aren't in the environment: `fleet.ts secrets` derives
      # them from PRINCIPAL_KEY and PRINCIPAL_KEY_PREVIOUS (HKDF, scripts/derive-assistant-key.ts)
      # straight into the engine's secrets file, never printing them.
      - name: Collect secrets
        env:
          PRINCIPAL_KEY: ${{ secrets.PRINCIPAL_KEY }}
          PRINCIPAL_KEY_PREVIOUS: ${{ secrets.PRINCIPAL_KEY_PREVIOUS }}
          DATA_KEY: ${{ secrets.DATA_KEY }}
          DATA_KEY_PREVIOUS: ${{ secrets.DATA_KEY_PREVIOUS }}
          TOKEN_PEPPER: ${{ secrets.TOKEN_PEPPER }}
          MEDIA_SIGNING_SECRET: ${{ secrets.MEDIA_SIGNING_SECRET }}
          PASSWORD_PEPPER: ${{ secrets.PASSWORD_PEPPER }}
          SETUP_TOKEN: ${{ secrets.SETUP_TOKEN }}
          OIDC_CLIENT_SECRET: ${{ secrets.OIDC_CLIENT_SECRET }}
          STREAM_WEBHOOK_SECRET: ${{ secrets.STREAM_WEBHOOK_SECRET }}
          MCP_TOKEN: ${{ secrets.MCP_TOKEN }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          for app in engine api delivery web; do
            node scripts/fleet.ts secrets "$app" "$RUNNER_TEMP/$app-secrets.json"
          done
      # The restore point for this deploy: a migration can't be rolled back, but D1 Time Travel
      # can restore the database to this bookmark (docs/backup-and-restore.md).
      - name: Record D1 bookmark
        run: |
          # shellcheck disable=SC2016 # the inner shell expands $CONFIG and $RUNNER_TEMP
          retry bash -c 'pnpm --filter @contentworker/engine exec wrangler d1 time-travel info DB --json --config "$CONFIG" > "$RUNNER_TEMP/d1-bookmark.json"'
          bookmark=$(jq -er .bookmark "$RUNNER_TEMP/d1-bookmark.json")
          echo "D1 bookmark for $ID before ${GITHUB_SHA::7}: \`$bookmark\`" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::D1 bookmark for $ID before this deploy: $bookmark"
      # Migrations run before the new code, and old code runs against the new schema until the
      # Workers below are live: a migration must be additive (expand).
      - name: Migrate D1
        run: retry pnpm --filter @contentworker/engine exec wrangler d1 migrations apply DB --remote --config "$CONFIG"
      # The engine owns every Durable Object and Workflow class the others bind by script name, so
      # it goes first; then the api, delivery, and the web app that fronts the api.
      - name: Deploy engine
        id: engine
        run: |
          secrets=()
          [ "$(cat "$RUNNER_TEMP/engine-secrets.json")" != "{}" ] && secrets=(--secrets-file "$RUNNER_TEMP/engine-secrets.json")
          retry pnpm --filter @contentworker/engine exec wrangler deploy --config "$CONFIG" "${secrets[@]}"
      - name: Deploy api
        id: api
        run: |
          secrets=()
          [ "$(cat "$RUNNER_TEMP/api-secrets.json")" != "{}" ] && secrets=(--secrets-file "$RUNNER_TEMP/api-secrets.json")
          retry pnpm --filter @contentworker/api exec wrangler deploy --config "$CONFIG" "${secrets[@]}"
      - name: Deploy delivery
        id: delivery
        run: |
          secrets=()
          [ "$(cat "$RUNNER_TEMP/delivery-secrets.json")" != "{}" ] && secrets=(--secrets-file "$RUNNER_TEMP/delivery-secrets.json")
          retry pnpm --filter @contentworker/delivery exec wrangler deploy --config "$CONFIG" "${secrets[@]}"
      - name: Build web
        run: CONTENTWORKER_WRANGLER_CONFIG="$CONFIG" pnpm --filter @contentworker/web build
      # `wrangler deploy` picks up the build's own config (.wrangler/deploy), made from $CONFIG.
      - name: Deploy web
        id: web
        run: |
          secrets=()
          [ "$(cat "$RUNNER_TEMP/web-secrets.json")" != "{}" ] && secrets=(--secrets-file "$RUNNER_TEMP/web-secrets.json")
          retry pnpm --filter @contentworker/web exec wrangler deploy "${secrets[@]}"
      # A new domain's certificate can take a few minutes to issue, so each check retries for up
      # to five minutes before it counts as failed.
      - name: Smoke test
        id: smoke
        run: |
          get() { curl -fsS --retry 30 --retry-all-errors --retry-delay 10 --retry-max-time 300 "$@"; }
          get "https://$DOMAIN/health"
          # D1 and the api (over the service binding) both answer.
          get "https://$DOMAIN/health/deep"
          # The admin itself renders (sign-in, or setup on a deployment with no people yet).
          get -L -o /dev/null "https://$DOMAIN/login"
          get "https://$API_DOMAIN/health"
          get -o /dev/null "https://$API_DOMAIN/openapi.json"
          get "https://$CDN_DOMAIN/health"
          # Delivery refuses an anonymous read (auth runs before its cache).
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://$CDN_DOMAIN/delivery/smoke/main/entries")
          [ "$status" = 401 ] || { echo "::error::anonymous delivery read answered $status, not 401"; exit 1; }
      # Warns rather than fails: a slow runner must not roll production back. Best of three.
      - name: Latency check
        continue-on-error: true
        run: |
          check() {
            local url=$1 budget=$2 best=999
            for _ in 1 2 3; do
              t=$(curl -fsSL -o /dev/null -w '%{time_total}' "$url") || continue
              best=$(awk -v a="$t" -v b="$best" 'BEGIN { print (a < b) ? a : b }')
            done
            echo "$url: ${best}s (budget ${budget}s)"
            if awk -v a="$best" -v b="$budget" 'BEGIN { exit !(a > b) }'; then
              echo "::warning title=Latency budget::$url took ${best}s, over its ${budget}s budget"
            fi
          }
          check "https://$DOMAIN/login" 1.5
          check "https://$DOMAIN/health/deep" 1.0
          check "https://$CDN_DOMAIN/health" 0.3
      # Any failure after the engine shipped puts each Worker that deployed back on its previous
      # version, engine first: it is the one that can refuse (Cloudflare won't roll a Worker back
      # past a Durable Object migration). If it can't go back, nothing else is rolled back either,
      # so a new engine never runs behind old Workers that bind it; the step fails for a person to
      # decide. A first deploy has no earlier version and stays. D1 migrations are not rolled back,
      # which is why they must be additive.
      - name: Roll back on a failed deploy
        if: failure() && steps.engine.outcome == 'success'
        env:
          API: ${{ steps.api.outcome }}
          DELIVERY: ${{ steps.delivery.outcome }}
          WEB: ${{ steps.web.outcome }}
        run: |
          msg="Deploy failed for ${GITHUB_SHA::7}"
          # rollback <name> <pnpm filter>: 0 rolled back, 2 no earlier version, 1 failed.
          rollback() {
            local name=$1 filter=$2 out attempt
            for attempt in 1 2 3; do
              if out=$(pnpm --filter "$filter" exec wrangler rollback -y -m "$msg" --config "$CONFIG" </dev/null 2>&1); then
                printf '%s\n' "$out"
                echo "Rolled back $name" >> "$GITHUB_STEP_SUMMARY"
                return 0
              fi
              printf '%s\n' "$out"
              if grep -q 'Could not find stable Worker Version to rollback to' <<<"$out"; then
                echo "::notice::$name has no earlier version (its first deploy), so it stays as it is"
                return 2
              fi
              echo "::warning::attempt $attempt to roll back $name failed"
              [ "$attempt" -lt 3 ] && sleep $((attempt * 15))
            done
            echo "::error::$name could not be rolled back; it is still on ${GITHUB_SHA::7}"
            return 1
          }
          engine=0
          rollback engine @contentworker/engine || engine=$?
          if [ "$engine" = 1 ]; then
            echo "::error::The engine could not be rolled back (a Durable Object migration since its last version prevents it), so the other Workers were left on ${GITHUB_SHA::7} to match it. Fix forward."
            exit 1
          fi
          failed=0
          [ "$API" = success ] && { rollback api @contentworker/api || [ $? = 2 ] || failed=1; }
          [ "$DELIVERY" = success ] && { rollback delivery @contentworker/delivery || [ $? = 2 ] || failed=1; }
          [ "$WEB" = success ] && { rollback web @contentworker/web || [ $? = 2 ] || failed=1; }
          exit "$failed"
      # Static docs Worker; independent of the app, so it goes last and can't block a deploy above.
      - name: Deploy docs
        id: docs
        if: fromJSON(inputs.deployment).docs
        run: retry pnpm --filter @contentworker/docs-site run deploy
      - name: Smoke test docs
        if: fromJSON(inputs.deployment).docs
        run: |
          host=$(node -e "const {parse}=require('jsonc-parser');console.log(parse(require('fs').readFileSync('apps/docs/wrangler.jsonc','utf8')).routes[0].pattern)")
          get() { curl -fsS --retry 30 --retry-all-errors --retry-delay 10 --retry-max-time 300 "$@"; }
          get -o /dev/null "https://$host/"
          get -o /dev/null "https://$host/reference/rest-api/"
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://$host/no-such-page-${GITHUB_SHA::7}/")
          [ "$status" = 404 ] || { echo "::error::an unknown docs page answered $status, not 404"; exit 1; }
      - name: Roll back docs on a failed smoke test
        if: failure() && steps.docs.outcome == 'success'
        run: retry pnpm --filter @contentworker/docs-site exec wrangler rollback -y -m "Docs smoke test failed for ${GITHUB_SHA::7}"
