name: Release SDKs

# Publishes @contentworker/sdk (packages/sdk/sdk: every SDK and the `contentworker` CLI in one
# package) to npm when a tag `sdk-v<version>` is pushed: bump its version, merge, then tag.
# A version already on npm is skipped, so a rerun is safe.
#
# npm trusted publishing: no token is stored. On npmjs.com the package's "Trusted publisher"
# names GitHub Actions, org `contentworker`, repo `contentworker`, workflow `sdk-release.yml`,
# environment `npm`. The publish carries a provenance attestation.
on:
  push:
    tags: ["sdk-v*"]

permissions:
  contents: read

concurrency:
  group: sdk-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: npm with trusted publishing
        run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - name: The tag matches the SDK's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./packages/sdk/sdk/package.json').version")
          test "$TAG" = "sdk-v${version}" || { echo "tag $TAG is not sdk-v${version}"; exit 1; }
      - name: The SDK's checks (and everything it bundles, the CLI included)
        run: |
          node --test scripts/sdk-packages.test.ts
          pnpm turbo run lint check-types test --filter='@contentworker/sdk...'
      - name: Pack, then load and type-check every subpath from the tarball
        run: |
          node scripts/sdk-packages.ts pack
          node scripts/sdk-packages.ts check
      - name: Publish (skips versions already on npm)
        run: node scripts/sdk-packages.ts publish
