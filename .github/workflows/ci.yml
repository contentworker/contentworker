name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue tests each queued PR on top of main and the PRs ahead of it, then merges it;
  # nobody has to bring a branch up to date by hand. It runs every job, the device tests included.
  merge_group:
  # The device tests run on each pull request, not again on the push its merge makes. Nothing
  # requires a branch to be up to date before it merges, so this nightly run (and a manual one)
  # checks main itself.
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

# A new push to a pull request supersedes its last run; a push to main never cancels one that
# has started. A run still waiting behind one is replaced by a newer push, which ships the same
# commits and more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The default GITHUB_TOKEN only needs to read the repository.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Turbo's task cache, kept between runs so a package that no change touched skips its lint,
      # type check, build and tests. A hit replays a pass without running the task, so it is only
      # as good as the task's hash: turbo.json and the packages' own turbo.json name every file a
      # task reads from outside its package, and scripts/turbo-cache.test.ts proves each by
      # changing the file and watching the hash move. Even so, the cache is never read on the runs
      # that check main itself:
      #   - a push to main (what the optional Deploy workflow ships), and the nightly and manual
      #     runs; they run every task from scratch (a hash we forgot to widen can't turn into a
      #     deployed commit). They still write the cache, which seeds the pull requests;
      #   - a pull request and the merge queue read it. Neither deploys anything, and the push that
      #     follows a merge re-runs everything.
      # The key holds the runner OS, node version and lockfile (the lockfile is in turbo's global
      # hash, so another lockfile's entries could never hit) and the commit, since a cache entry
      # can't be overwritten; the restore key takes the newest entry for the same lockfile, so
      # a run starts from main's (or the same pull request's earlier) results.
      - name: Restore the turbo cache
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # One turbo run, so the three checks share the runner's cores instead of taking turns.
      # `--continue` keeps going past a failure, so a red build reports all of its problems in one
      # go; turbo groups each task's log and lists the failed ones at the end. `build` bundles every
      # Worker (api, delivery, engine and media build with `wrangler deploy --dry-run`; nothing is
      # uploaded).
      - name: Lint, type-check and build
        if: ${{ !cancelled() }}
        env:
          TURBO_CACHE_DIR: .turbo/cache
        run: pnpm turbo run lint check-types build --continue

      # Two turbo runs, not one, so the suites with timing budgets don't share the runner. With one
      # `pnpm test` turbo starts about ten packages at once on 4 cores, and the workerd suites (db,
      # engine, media: Miniflare D1, Durable Objects, Workflows, R2; the engine's end-to-end runs use
      # AI_MODE=mock, so no network or Cloudflare account) ran 190-340 s each, close to their 30 s
      # per-test timeout on the slowest runs. The node suites go first, the workerd suites after
      # them; both run in this one job, so no second runner is billed for install and setup. A new
      # package's suite lands in the node run unless it is added to the second filter.
      - name: Test (node suites)
        if: ${{ !cancelled() }}
        env:
          TURBO_CACHE_DIR: .turbo/cache
        run: >-
          pnpm turbo run test --continue
          --filter='!@contentworker/db' --filter='!@contentworker/engine' --filter='!@contentworker/media'
      - name: Test (workerd suites)
        if: ${{ !cancelled() }}
        env:
          TURBO_CACHE_DIR: .turbo/cache
        run: >-
          pnpm turbo run test --continue
          --filter=@contentworker/db --filter=@contentworker/engine --filter=@contentworker/media

      # The install renderer, setup and deploy scripts and Durable Object migrations.
      - name: Test scripts
        if: ${{ !cancelled() }}
        run: pnpm test:scripts

      # The Claude Code toolkit in .claude/: its skills, agents and hook wiring, and what the
      # hooks allow, ask about and deny.
      - name: Test toolkit
        if: ${{ !cancelled() }}
        run: pnpm test:toolkit

      # Known high or critical advisories in anything that ships (dev tooling excluded).
      - name: Audit dependencies
        if: ${{ !cancelled() }}
        run: pnpm audit --prod --audit-level high

      # Every run saves what it ran (turbo caches only tasks that passed), a failed one too, so a
      # re-run starts from the tasks that already passed.
      - name: Save the turbo cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}

  # Whether to run the device tests. A pull request runs them only when it changes something the
  # admin and its dev server load: apps/web and the four Workers its dev server runs beside it
  # (api, engine, media, delivery), every workspace package any of them depends on, the files
  # outside a package that feed a generated embed, the lockfile, workspace file and root configs,
  # and this workflow. The list is not kept by hand: scripts/device-paths.ts derives it from the
  # `auxiliaryWorkers` in apps/web/vite.config.ts, the packages' `workspace:` dependencies and the
  # turbo inputs of each `generate` task, and scripts/device-paths.test.ts holds it equal to
  # turbo's own dependency graph. Unit-test files and READMEs inside those packages are left out
  # (the dev server never loads them), and so is everything else: the docs site, the SDKs the
  # admin doesn't use, the install scripts, the .claude toolkit. (A change too big for the files
  # API, 3000 files, runs them.) A push to main does not: its pull request already ran them. The
  # nightly and manual runs and the merge queue run them. A
  # nightly run skips them when main has no commit newer than the last nightly's window (25 h):
  # the previous night already ran them on the same code. (`verify` still runs nightly for the
  # dependency audit, which can go red with no commit.)
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      devices: ${{ steps.paths.outputs.devices }}
    steps:
      # Only the path filter needs the repository, and only a pull request uses it.
      - if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: ${{ github.event_name == 'pull_request' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: paths
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          case "$EVENT" in
            pull_request) ;;
            push)
              echo "A push to main: its pull request ran the device tests"
              echo "devices=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            schedule)
              since=$(date -u -d '25 hours ago' +%Y-%m-%dT%H:%M:%SZ)
              recent=$(gh api "repos/$REPO/commits?sha=main&since=$since&per_page=1" --jq 'length')
              if [ "$recent" = 0 ]; then
                echo "No commit on main in 25 hours: the last nightly run covered this code"
                echo "devices=false" >> "$GITHUB_OUTPUT"
              else
                echo "devices=true" >> "$GITHUB_OUTPUT"
              fi
              exit 0
              ;;
            *)
              echo "devices=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')
          if [ "$(wc -l <<<"$files")" -ge 3000 ]; then
            echo "3000 changed files or more: running the device tests"
            echo "devices=true" >> "$GITHUB_OUTPUT"
          elif hit=$(node scripts/device-paths.ts match <<<"$files"); then
            echo "$hit is loaded by the admin or its dev server: running the device tests"
            echo "devices=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing the admin or its dev server loads changed: skipping the device tests"
            echo "devices=false" >> "$GITHUB_OUTPUT"
          fi

  # The web app in WebKit as an iPhone and an iPad, both ways up, and a desktop: layout, safe
  # areas, touch targets and the on-screen keyboard (apps/web/e2e). The dev server runs offline
  # (mock AI, no remote bindings, its own seeded database), so no Cloudflare account is needed.
  # Three jobs at once, each on its own server, split by E2E_PART (apps/web/playwright.config.ts)
  # into near-equal shares of the suite's time; `devices` below is the one required check. (There
  # were four: the sign-in specs had a job to themselves, and its runner's setup cost more than
  # their two minutes of tests. They now run at the end of `webkit`, about two minutes longer than
  # the other two, and the slowest part stays near 12 of its 20 minutes.)
  device-tests:
    name: devices (${{ matrix.part }})
    needs: changes
    if: needs.changes.outputs.devices == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        part: [webkit, axe, cms]
    env:
      E2E_PART: ${{ matrix.part }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The browser download is cached by Playwright version, so it is fetched only on a miss. The
      # system libraries come from apt, which the runner's Ubuntu mirror sometimes serves very
      # slowly (two runs spent all 25 minutes there), so that step has its own short timeout and
      # one retry instead of the job's whole budget.
      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @contentworker/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache WebKit
        id: webkit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Download WebKit
        if: ${{ steps.webkit.outputs.cache-hit != 'true' }}
        timeout-minutes: 5
        run: pnpm --filter @contentworker/web exec playwright install webkit chromium
      # Fetch Ubuntu packages over HTTPS: on 2026-11-11 the runners' plain-HTTP (port 80) route to
      # every Ubuntu archive failed for hours while HTTPS worked, and apt-get only stalled.
      - name: Fetch Ubuntu packages over HTTPS
        run: |
          for f in /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list; do
            [ -f "$f" ] && sudo sed -i 's#http://\([a-z.]*ubuntu\.com\)#https://\1#g' "$f"
          done
          cat /etc/apt/apt-mirrors.txt 2>/dev/null || true
      - name: Install WebKit system dependencies
        id: deps
        continue-on-error: true
        timeout-minutes: 5
        run: pnpm --filter @contentworker/web exec playwright install-deps webkit chromium
      # A timed-out first attempt kills pnpm but can leave its apt-get running with the dpkg lock
      # held. If dpkg is installing, let it finish; if apt-get is still only downloading, its
      # mirror is stalling, so stop it and fetch from the main Ubuntu archive instead.
      - name: Install WebKit system dependencies (retry)
        if: ${{ steps.deps.outcome == 'failure' }}
        timeout-minutes: 10
        run: |
          while pgrep -x dpkg >/dev/null; do
            echo "Waiting for the first attempt's dpkg to finish"
            sleep 5
          done
          if pgrep -x apt-get >/dev/null; then
            echo "The first attempt's apt-get is stuck downloading; stopping it"
            sudo pkill -x apt-get || true
            while pgrep -x apt-get >/dev/null; do sleep 1; done
            sudo dpkg --configure -a
          fi
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            echo "https://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt
          fi
          pnpm --filter @contentworker/web exec playwright install-deps webkit chromium
      - name: Device tests
        run: pnpm --filter @contentworker/web e2e
      # A failure's traces (DOM, network, console at each step): open with `playwright show-trace`.
      - name: Keep the failures' traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: device-test-traces-${{ matrix.part }}
          path: apps/web/test-results/
          retention-days: 7

  # The required check: green when every part passed, or when `changes` decided to skip them. A
  # failed or cancelled `changes` skips the parts too, so it fails this check.
  devices:
    needs: [changes, device-tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every part passed, or none was needed
        env:
          CHANGES: ${{ needs.changes.result }}
          RESULT: ${{ needs.device-tests.result }}
        run: |
          echo "changes: $CHANGES, device tests: $RESULT"
          [ "$CHANGES" = success ] && { [ "$RESULT" = success ] || [ "$RESULT" = skipped ]; }
