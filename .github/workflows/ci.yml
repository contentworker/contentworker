name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue tests each queued PR on top of main and the PRs ahead of it, then merges it;
  # nobody has to bring a branch up to date by hand. It runs every job, the device tests included;
  # `release` still runs only on a push to main.
  merge_group:
  # The device tests run on each pull request, not again on the push its merge makes. Nothing
  # requires a branch to be up to date before it merges, so this nightly run (and a manual one)
  # checks main itself.
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

# A new push to a pull request supersedes its last run; a push to main never cancels one that
# has started. A run still waiting behind one is replaced by a newer push, which ships the same
# commits and more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The default GITHUB_TOKEN only needs to read the repository.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # One turbo run, so the three checks share the runner's cores instead of taking turns.
      # `--continue` keeps going past a failure, so a red build reports all of its problems in one
      # go; turbo groups each task's log and lists the failed ones at the end. `build` bundles every
      # Worker (api, delivery, engine and media build with `wrangler deploy --dry-run`; nothing is
      # uploaded).
      - name: Lint, type-check and build
        if: ${{ !cancelled() }}
        run: pnpm turbo run lint check-types build --continue

      # Two turbo runs, not one, so the suites with timing budgets don't share the runner. With one
      # `pnpm test` turbo starts about ten packages at once on 4 cores, and the workerd suites (db,
      # engine, media: Miniflare D1, Durable Objects, Workflows, R2; the engine's end-to-end runs use
      # AI_MODE=mock, so no network or Cloudflare account) ran 190-340 s each, close to their 30 s
      # per-test timeout on the slowest runs. The node suites go first, the workerd suites after
      # them; both run in this one job, so no second runner is billed for install and setup. A new
      # package's suite lands in the node run unless it is added to the second filter.
      - name: Test (node suites)
        if: ${{ !cancelled() }}
        run: >-
          pnpm turbo run test --continue
          --filter='!@contentworker/db' --filter='!@contentworker/engine' --filter='!@contentworker/media'
      - name: Test (workerd suites)
        if: ${{ !cancelled() }}
        run: >-
          pnpm turbo run test --continue
          --filter=@contentworker/db --filter=@contentworker/engine --filter=@contentworker/media

      # The fleet renderer, deploy script and Durable Object migrations, against a fixture registry.
      - name: Test fleet
        if: ${{ !cancelled() }}
        run: pnpm test:fleet

      # The Claude Code toolkit in .claude/: its skills, agents and hook wiring, and what the
      # hooks allow, ask about and deny.
      - name: Test toolkit
        if: ${{ !cancelled() }}
        run: pnpm test:toolkit

      # Known high or critical advisories in anything that ships (dev tooling excluded).
      - name: Audit dependencies
        if: ${{ !cancelled() }}
        run: pnpm audit --prod --audit-level high

  # Whether to run the device tests. A pull request runs them unless it only touches paths the
  # admin and its dev server never read: the docs and docs site, the .claude toolkit and top-level
  # Markdown (one too big for the files API, 3000 files, runs them). A push to main does not: its
  # pull request already ran them, and `release` never waited for them. The nightly and manual runs
  # and the merge queue run them. A nightly run skips them when main has no commit newer than the
  # last nightly's window (25 h): the previous night already ran them on the same code. (`verify`
  # still runs nightly for the dependency audit, which can go red with no commit.)
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      devices: ${{ steps.paths.outputs.devices }}
    steps:
      - id: paths
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          case "$EVENT" in
            pull_request) ;;
            push)
              echo "A push to main: its pull request ran the device tests"
              echo "devices=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            schedule)
              since=$(date -u -d '25 hours ago' +%Y-%m-%dT%H:%M:%SZ)
              recent=$(gh api "repos/$REPO/commits?sha=main&since=$since&per_page=1" --jq 'length')
              if [ "$recent" = 0 ]; then
                echo "No commit on main in 25 hours: the last nightly run covered this code"
                echo "devices=false" >> "$GITHUB_OUTPUT"
              else
                echo "devices=true" >> "$GITHUB_OUTPUT"
              fi
              exit 0
              ;;
            *)
              echo "devices=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')
          if [ "$(wc -l <<<"$files")" -ge 3000 ] \
            || grep -qvE '^(docs/|apps/docs/|\.claude/|[^/]+\.md$)' <<<"$files"; then
            echo "devices=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only docs or toolkit files changed: skipping the device tests"
            echo "devices=false" >> "$GITHUB_OUTPUT"
          fi

  # The web app in WebKit as an iPhone and an iPad, both ways up, and a desktop: layout, safe
  # areas, touch targets and the on-screen keyboard (apps/web/e2e). The dev server runs offline
  # (mock AI, no remote bindings, its own seeded database), so no Cloudflare account is needed.
  # Four jobs at once, each on its own server, split by E2E_PART (apps/web/playwright.config.ts)
  # into near-equal shares of the suite's time; `devices` below is the one required check.
  device-tests:
    name: devices (${{ matrix.part }})
    needs: changes
    if: needs.changes.outputs.devices == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        part: [webkit, axe, cms, sign-in]
    env:
      E2E_PART: ${{ matrix.part }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The browser download is cached by Playwright version, so it is fetched only on a miss. The
      # system libraries come from apt, which the runner's Ubuntu mirror sometimes serves very
      # slowly (two runs spent all 25 minutes there), so that step has its own short timeout and
      # one retry instead of the job's whole budget.
      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @contentworker/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache WebKit
        id: webkit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Download WebKit
        if: ${{ steps.webkit.outputs.cache-hit != 'true' }}
        timeout-minutes: 5
        run: pnpm --filter @contentworker/web exec playwright install webkit chromium
      - name: Install WebKit system dependencies
        id: deps
        continue-on-error: true
        timeout-minutes: 5
        run: pnpm --filter @contentworker/web exec playwright install-deps webkit chromium
      # A timed-out first attempt kills pnpm but can leave its apt-get running with the dpkg lock
      # held; wait for it to finish (it often completes the install) before trying again.
      - name: Install WebKit system dependencies (retry)
        if: ${{ steps.deps.outcome == 'failure' }}
        timeout-minutes: 10
        run: |
          while pgrep -x apt-get >/dev/null || pgrep -x dpkg >/dev/null; do
            echo "Waiting for the first attempt's apt-get to release the dpkg lock"
            sleep 5
          done
          pnpm --filter @contentworker/web exec playwright install-deps webkit chromium
      - name: Device tests
        run: pnpm --filter @contentworker/web e2e
      # A failure's traces (DOM, network, console at each step): open with `playwright show-trace`.
      - name: Keep the failures' traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: device-test-traces-${{ matrix.part }}
          path: apps/web/test-results/
          retention-days: 7

  # The required check: green when every part passed, or when `changes` decided to skip them. A
  # failed or cancelled `changes` skips the parts too, so it fails this check.
  devices:
    needs: [changes, device-tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every part passed, or none was needed
        env:
          CHANGES: ${{ needs.changes.result }}
          RESULT: ${{ needs.device-tests.result }}
        run: |
          echo "changes: $CHANGES, device tests: $RESULT"
          [ "$CHANGES" = success ] && { [ "$RESULT" = success ] || [ "$RESULT" = skipped ]; }

  # Hands a commit that passed verify on main to the fleet. The deployment registry and the rings
  # live in the private contentworker/fleet repo, whose release.yml refuses any commit not on this
  # repo's main and deploys it ring by ring (workflow_dispatch, input `sha`). The token needs Actions
  # write on that repo only. While FLEET_DISPATCH_TOKEN is unset (a fork, or before the fleet's
  # cutover) the job succeeds without dispatching; secrets can't be tested in a job `if`, so the
  # steps test the copy in env. See docs/deployment.md.
  release:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FLEET_DISPATCH_TOKEN: ${{ secrets.FLEET_DISPATCH_TOKEN }}
    steps:
      - name: Note that no fleet dispatch token is set
        if: ${{ env.FLEET_DISPATCH_TOKEN == '' }}
        run: echo "::notice::FLEET_DISPATCH_TOKEN is not set; not dispatching a release to the fleet"
      - name: Dispatch the release
        if: ${{ env.FLEET_DISPATCH_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ env.FLEET_DISPATCH_TOKEN }}
          SHA: ${{ github.sha }}
        run: gh workflow run release.yml --repo contentworker/fleet --ref main -f sha="$SHA"
