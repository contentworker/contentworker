packages:
  - "packages/*"
  - "packages/sdk/*"
  - "apps/*"

# Single source of truth for every external dependency version. Every package.json names its
# dependencies as `catalog:`; bump the version here and it moves everywhere at once. Only
# peerDependencies keep their own (deliberately broad) ranges. `catalogMode: strict` makes
# `pnpm add` refuse a version outside the catalog, so add the entry here first.
catalogMode: strict

catalog:
  # React
  react: ^19.2.8
  react-dom: ^19.2.8
  "@types/react": ^19.2.0
  "@types/react-dom": ^19.2.0
  react-router: ^8.4.0
  "@react-router/dev": ^8.4.0
  "@tanstack/react-query": ^5.106.1
  isbot: ^5.1.36

  # shadcn/ui primitives (packages/ui and apps/web)
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  lucide-react: ^1.70.0
  radix-ui: ^1.6.0
  tailwind-merge: ^3.0.2
  recharts: ^3.10.1

  # Admin UI (apps/web)
  "@xyflow/react": ^12.12.1
  "@tiptap/core": 3.33.0
  "@tiptap/extension-table": 3.33.0
  "@tiptap/pm": 3.33.0
  "@tiptap/react": 3.33.0
  "@tiptap/starter-kit": 3.33.0
  "@simplewebauthn/browser": 14.0.0
  "@simplewebauthn/server": 14.0.3
  jose: 6.2.15
  uqr: 0.1.3
  use-stick-to-bottom: ^1.1.6
  tw-animate-css: ^1.4.0
  "@fontsource-variable/inter": ^5.3.0
  "@fontsource/ibm-plex-mono": ^5.3.0

  # Styling: Tailwind v4 is CSS-first; keep the plugin and core in lockstep
  tailwindcss: ^4.3.4
  "@tailwindcss/vite": ^4.3.4

  # Data, validation, HTTP
  drizzle-orm: ^0.45.4
  zod: ^4.6.7
  hono: ^4.13.16
  graphql: ^17.1.0
  hono-openapi: ^1.3.1
  zod-openapi: ^6.0.1
  "@hono/standard-validator": ^0.4.0
  "@scalar/hono-api-reference": ^0.12.18
  "@scalar/api-reference": ^1.77.0

  # Image placeholders (asset ingest): pure JS, so they run on workerd
  fast-png: ^8.0.0
  thumbhash: ^0.1.1

  # AI and MCP
  ai: 7.0.159
  agents: 0.32.0
  "@cloudflare/ai-chat": 0.12.2
  "@ai-sdk/react": 4.0.167
  streamdown: 2.7.1
  "@modelcontextprotocol/server": 2.4.0
  "@modelcontextprotocol/client": ^2.4.0

  # Build toolchain
  typescript: ^7.0.2
  vitest: 5.1.0
  vite: ^8.3.6
  tsup: ^9.0.0
  # TypeScript 7 ships no compiler JS API, so tsup bundles JS only and `tsc` emits the .d.ts
  tsx: ^4.23.15
  turbo: ^2.11.7
  "@biomejs/biome": ^2.6.5
  "@types/node": ^26.6.6 # tracks the Node major in .nvmrc and CI, not npm latest
  jsonc-parser: 3.3.1

  # Testing
  jsdom: ^30.0.1
  "@testing-library/dom": ^10.4.1
  "@testing-library/react": ^16.3.2
  "@playwright/test": 1.65.0
  "@axe-core/playwright": ^4.13.0

  # Docs site (apps/docs)
  astro: ^7.4.7
  "@astrojs/starlight": ^0.42.9
  lucide: 1.70.0

  # SDKs
  vue: ^3.5.45

  # Cloudflare
  wrangler: ^4.158.0
  "@cloudflare/workers-types": ^5.20261106.1
  "@cloudflare/vitest-plugin": ^1.6.0
  "@cloudflare/vite-plugin": ^1.67.0

overrides:
  "postcss-nested>postcss-selector-parser": ^7.1.6
  "express>body-parser": ^2.4.0
  "@ai-sdk/provider-utils>undici": ^7.30.1
  "unifont>undici": ^8.12.2

onlyBuiltDependencies:
  - esbuild
  - workerd
  - sharp
